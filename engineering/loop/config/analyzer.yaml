opencode:
  binary: "opencode"
  model: ""
  timeout: 900
  format: "json"

knowledge_base:
  path: "config/patch_knowledge_base.json"
  max_entries: 100
  fingerprint_reason_length: 80

confidence:
  threshold: 0.7        # < threshold 的补丁触发 human gate（pending/approve/reject）
  rule_match: 0.95      # ScriptedAnalyzer 命中
  kb_match: 0.98        # KnowledgeBaseAnalyzer 命中（Reflexion 召回）
  # opencode（LLM）confidence 固定 0.8，硬编码在 OpencodeAnalyzer——
  # 低于 threshold(0.7) 的补丁必触发 human gate，故不暴露为可配置项

human_gate:
  enabled: true
  triggers:
    - low_confidence
    - kernel_patch
    - dd_boot_reboot

budget:
  wall_clock_seconds: 3600   # session 总耗时上限（秒），0=不限制；超时触发 DONE_FAILURE
