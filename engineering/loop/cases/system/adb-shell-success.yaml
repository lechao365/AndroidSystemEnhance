suite: system.adb_shell
version: 1
defaults:
  capture_timeout: 10.0
  recent_limit: 200
cases:
  - id: adb_shell_reachable
    command: "echo adb_ok"
    assert:
      type: contains
      value: "adb_ok"
    severity: critical
    description: "验证 adb shell 可执行"

  - id: boot_completed
    command: "getprop sys.boot_completed"
    assert:
      type: contains
      value: "1"
    severity: critical
    requires: [adb_shell_reachable]
    description: "验证 Android 已完成启动"

  - id: adbd_running
    command: "getprop init.svc.adbd"
    assert:
      type: contains
      value: "running"
    severity: critical
    requires: [adb_shell_reachable]
    description: "验证 adbd 进程状态"

  - id: root_identity
    command: "id"
    assert:
      type: regex
      pattern: "uid="
    severity: warn
    requires: [adb_shell_reachable]
    description: "验证 shell 身份命令可执行"