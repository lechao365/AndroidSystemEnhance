# 系统级 boot 成功验收用例。
# include common.shell 获取 shell_reachable 用例 + 公共诊断 collector
# （boot_log / init_log / crash_dump）。
# FQN 命名空间：system.boot
suite: system.boot
version: 1

include:
  - common/shell

cases:
  - id: boot_completed
    description: "sys.boot_completed 属性为 1"
    command: "getprop sys.boot_completed"
    assert:
      type: contains
      value: "1"
    severity: critical
    requires: [shell_reachable]  # short name，loader 解析为 common.shell.shell_reachable
    on_fail:
      collectors: [boot_log, init_log]  # 解析为 common.shell.boot_log / init_log
    tags: [boot, system]

  - id: zygote_running
    description: "zygote 服务处于 running 状态"
    command: "getprop init.svc.zygote"
    assert:
      type: contains
      value: "running"
    severity: critical
    requires: [shell_reachable]
    on_fail:
      collectors: [serial_recent, crash_dump, init_log]
    tags: [boot, android_core]

  - id: surfaceflinger_running
    description: "surfaceflinger 服务处于 running 状态"
    command: "getprop init.svc.surfaceflinger"
    assert:
      type: contains
      value: "running"
    severity: critical
    requires: [shell_reachable]
    on_fail:
      collectors: [crash_dump, init_log]
    tags: [boot, android_core]
