suite: features.lciod.hal
version: 1
include:
  - features/lciod/common
defaults:
  capture_timeout: 20.0
  recent_limit: 400
cases:
  - id: hal_process_running
    description: "[HA-10/HA-11] HAL 进程 lechao_lciod_hal 存活（init.svc）"
    command: "getprop init.svc.lechao_lciod_hal"
    assert: {type: contains_any, values: ["running", "restarting"]}
    severity: critical
    requires: [adb_shell_reachable]
    on_fail:
      collectors: [lciod_hal_logcat, lciod_device_state]

  - id: hal_vintf_manifest_present
    description: "[HA-13] VINTF manifest vendor.lechao.lciod.IIoHal-service.xml 存在"
    command: "ls /vendor/etc/vintf/manifest/vendor.lechao.lciod.IIoHal-service.xml 2>/dev/null && echo PRESENT || echo MISSING"
    assert: {type: contains, value: "PRESENT"}
    severity: critical
    requires: [adb_shell_reachable]
    on_fail:
      collectors: [lciod_device_state]

  - id: hal_service_registered_by_name
    description: "[HA-11] service list 含 vendor.lechao.lciod.IIoHal（HW Binder 发布成功）"
    command: "service list | grep vendor.lechao.lciod.IIoHal"
    assert: {type: contains, value: "vendor.lechao.lciod.IIoHal"}
    severity: critical
    requires: [hal_process_running]
    on_fail:
      collectors: [lciod_hal_logcat, lciod_device_state]

  - id: hal_list_devices_nonempty
    description: "[HA-01] listDevices 返回非空（设备节点存在即 HAL 可枚举）"
    command: "test -c /dev/vendor_lechao_usbd0 && echo DEVICE_LIST_OK || echo NO_DEVICE"
    assert: {type: contains, value: "DEVICE_LIST_OK"}
    severity: critical
    requires: [hal_process_running, lciod_device_node_present]
    on_fail:
      collectors: [lciod_hal_logcat, lciod_device_state]

  - id: hal_get_stats_via_ioctl
    description: "[HA-03/HA-07] HAL getStats 经临时 fd + ioctl 成功（字段正确）"
    command: "fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 1 >/dev/null 2>/dev/null; fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "write_bytes", op: "ge", value: 0}
    severity: critical
    requires: [hal_list_devices_nonempty]
    on_fail:
      collectors: [lciod_hal_logcat, lciod_fault_verify_json]

  - id: hal_reset_state_success
    description: "[HA-07] HAL resetState 成功（临时 fd ioctl RESET_STATE 退出码 0）"
    command: "fault-verify stats reset --device /dev/vendor_lechao_usbd0 >/dev/null 2>/dev/null; echo $?"
    assert: {type: contains, value: "0"}
    severity: critical
    requires: [hal_get_stats_via_ioctl]
    on_fail:
      collectors: [lciod_hal_logcat, lciod_fault_verify_json]

  - id: hal_get_config_success
    description: "[HA-07] HAL getConfig 成功（临时 fd ioctl GET_CONFIG）"
    command: "fault-verify config get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "enabled", op: "exists"}
    severity: critical
    requires: [hal_list_devices_nonempty]
    on_fail:
      collectors: [lciod_hal_logcat, lciod_fault_verify_json]

  - id: hal_set_config_success
    description: "[HA-07] HAL setConfig 成功 + 回读一致（临时 fd ioctl SET_CONFIG）"
    command: "fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 1 >/dev/null 2>/dev/null; fault-verify config get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "enabled", op: "ge", value: 1}
    severity: critical
    requires: [hal_get_config_success]
    on_fail:
      collectors: [lciod_hal_logcat, lciod_fault_verify_json]

  - id: hal_open_device_with_retry
    description: "[HA-02] open_device 带重试——HAL 可用即代表重试逻辑通过"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null | grep -c read_bytes"
    assert: {type: regex, pattern: "^[1-9][0-9]*$"}
    severity: critical
    requires: [hal_get_stats_via_ioctl]
    on_fail:
      collectors: [lciod_hal_logcat, lciod_fault_verify_json]

  - id: hal_read_event_legal
    description: "[HA-04/HA-08] HAL readEvent 接口返回合法（持久 fd，event_type 字段或超时）"
    command: "fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 1 >/dev/null 2>/dev/null; MNT=$(mount | grep -o '/mnt/media_rw/[^ ]*' | head -1); f=$MNT/lciod_hal_test.dat; dd if=/dev/zero of=$f bs=1M count=1 2>/dev/null; dd if=$f of=/dev/null bs=1M count=1 2>/dev/null; sleep 2; timeout 5 fault-verify event read --device /dev/vendor_lechao_usbd0 --timeout-ms 3000 --json 2>&1 || true"
    assert: {type: contains_any, values: ["\"event_type\"", "\"error\": true", "Event read failed"]}
    severity: warn
    requires: [hal_get_stats_via_ioctl]
    tags: [needs_usb_rw]
    on_fail:
      collectors: [lciod_hal_logcat, lciod_fault_verify_json]

  - id: hal_persistent_fd_consecutive_read
    description: "[HA-08] HAL 持久 fd——连续 readEvent 返回合法（不重新 open）"
    command: "MNT=$(mount | grep -o '/mnt/media_rw/[^ ]*' | head -1); f=$MNT/lciod_hal_test.dat; dd if=/dev/zero of=$f bs=1M count=1 2>/dev/null; dd if=$f of=/dev/null bs=1M count=1 2>/dev/null; sleep 2; fault-verify event read --device /dev/vendor_lechao_usbd0 --timeout-ms 2000 --json 2>&1; fault-verify event read --device /dev/vendor_lechao_usbd0 --timeout-ms 2000 --json 2>&1"
    assert: {type: contains_any, values: ["\"event_type\"", "\"error\": true", "Event read failed"]}
    severity: warn
    requires: [hal_read_event_legal]
    tags: [needs_usb_rw]
    on_fail:
      collectors: [lciod_hal_logcat]

  - id: hal_read_event_drained
    description: "[HA-04] readEvent 排空策略——缓冲区排空后返回超时（合法）"
    command: "timeout 8 fault-verify event read --device /dev/vendor_lechao_usbd0 --timeout-ms 3000 --json 2>&1; echo exit=$?"
    assert: {type: regex, pattern: "exit=(0|4|124)"}
    severity: warn
    requires: [hal_read_event_legal]
    on_fail:
      collectors: [lciod_hal_logcat]

  - id: hal_field_mapping_vendor_product
    description: "[HA-09] 字段映射——vendor/product 字符串非空"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "vendor", op: "exists"}
    severity: critical
    requires: [hal_get_stats_via_ioctl]
    on_fail:
      collectors: [lciod_fault_verify_json]

  - id: hal_single_binder_thread
    description: "[HA-10] HAL 单 Binder 线程——进程存在"
    command: "HALPID=$(ps -A | grep lechao_lciod_hal | awk '{print $2}' | head -1); test -n \"$HALPID\" && echo HAL_FOUND || echo HAL_NOT_FOUND"
    assert: {type: contains, value: "HAL_FOUND"}
    severity: warn
    requires: [hal_process_running]
    on_fail:
      collectors: [lciod_hal_logcat]

  - id: hal_parse_minor_from_path
    description: "[HA-12] ParseMinorFromPath——设备节点 minor=0 可解析（节点存在即 HAL 可识别）"
    command: "test -c /dev/vendor_lechao_usbd0 && echo MINOR_OK || echo MINOR_FAIL"
    assert: {type: contains, value: "MINOR_OK"}
    severity: warn
    requires: [lciod_device_node_present]
    on_fail:
      collectors: [lciod_device_state]
