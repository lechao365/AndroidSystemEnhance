suite: features.lciod.end_to_end
version: 1
include:
  - features/lciod/common
defaults:
  capture_timeout: 60.0
  recent_limit: 600
cases:
  - id: e2e_stats_reset_and_check
    description: "[e2e / KE-03/KE-15] stats reset → dd 读写 → write_bytes > 0"
    command: "fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 1 >/dev/null 2>/dev/null; fault-verify stats reset --device /dev/vendor_lechao_usbd0 >/dev/null 2>/dev/null; MNT=$(mount | grep -o '/mnt/media_rw/[^ ]*' | head -1); f=$MNT/lciod_e2e_test.dat; dd if=/dev/zero of=$f bs=1M count=4 2>/dev/null; dd if=$f of=/dev/null bs=1M count=4 2>/dev/null; sleep 1; fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "write_bytes", op: "gt", value: 0}
    severity: critical
    requires: [lciod_device_node_present]
    tags: [needs_usb_rw, e2e]
    on_fail:
      collectors: [lciod_fault_verify_json, lciod_kmsg, lciod_device_state]

  - id: e2e_config_toggle_disable
    description: "[e2e / KE-05] config set enabled=0 → 回读 enabled=0（边界：禁用生效）"
    command: "fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 0 >/dev/null 2>/dev/null; fault-verify config get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null; fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 1 >/dev/null 2>/dev/null"
    assert: {type: json_field, path: "enabled", op: "eq", value: 0}
    severity: critical
    requires: [lciod_device_node_present]
    tags: [e2e]
    on_fail:
      collectors: [lciod_fault_verify_json, lciod_kmsg]

  - id: e2e_config_toggle_enable
    description: "[e2e / KE-05] config set enabled=1 → 回读 enabled=1（恢复正常）"
    command: "fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 1 >/dev/null 2>/dev/null; fault-verify config get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "enabled", op: "ge", value: 1}
    severity: critical
    requires: [lciod_device_node_present]
    tags: [e2e]
    on_fail:
      collectors: [lciod_fault_verify_json, lciod_kmsg]

  - id: e2e_event_flow
    description: "[e2e / KE-06/KE-08] stats reset → dd 读写 → event read 返回合法（event_type 字段或超时）"
    command: "fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 1 >/dev/null 2>/dev/null; fault-verify stats reset --device /dev/vendor_lechao_usbd0 >/dev/null 2>/dev/null; MNT=$(mount | grep -o '/mnt/media_rw/[^ ]*' | head -1); f=$MNT/lciod_e2e_evt.dat; dd if=/dev/zero of=$f bs=1M count=2 2>/dev/null; dd if=$f of=/dev/null bs=1M count=2 2>/dev/null; sleep 3; timeout 10 fault-verify event read --device /dev/vendor_lechao_usbd0 --timeout-ms 5000 --json 2>&1 || true"
    assert: {type: contains_any, values: ["\"event_type\"", "\"error\": true", "Event read failed"]}
    severity: warn
    requires: [e2e_stats_reset_and_check]
    tags: [needs_usb_rw, e2e]
    on_fail:
      collectors: [lciod_fault_verify_json, lciod_kmsg, lciod_hal_logcat]

  - id: e2e_daemon_proxy_path
    description: "[e2e / DA-01] 经 Daemon IIoService 路径 stats get 成功（writeBytes 字段）"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "write_bytes", op: "ge", value: 0}
    severity: critical
    requires: [lciod_device_node_present]
    tags: [e2e]
    on_fail:
      collectors: [lciod_daemon_logcat, lciod_fault_verify_json]

  - id: e2e_disabled_stats_frozen
    description: "[e2e / KE-05 边界] enabled=0 时 dd 后 write_bytes 仍为 0（统计冻结）"
    command: "fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 0 >/dev/null 2>/dev/null; fault-verify stats reset --device /dev/vendor_lechao_usbd0 >/dev/null 2>/dev/null; MNT=$(mount | grep -o '/mnt/media_rw/[^ ]*' | head -1); f=$MNT/lciod_e2e_dis.dat; dd if=/dev/zero of=$f bs=1M count=2 2>/dev/null; sleep 1; fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null; fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 1 >/dev/null 2>/dev/null"
    assert: {type: json_field, path: "write_bytes", op: "eq", value: 0}
    severity: critical
    requires: [e2e_stats_reset_and_check]
    tags: [needs_usb_rw, e2e]
    on_fail:
      collectors: [lciod_fault_verify_json, lciod_kmsg]
