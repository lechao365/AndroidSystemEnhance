suite: features.lciod.daemon
version: 1
include:
  - features/lciod/common
defaults:
  capture_timeout: 25.0
  recent_limit: 400
cases:
  - id: daemon_process_running
    description: "[DA-03/DA-08] Daemon 进程 lechao_lciod 存活（init.svc）"
    command: "getprop init.svc.lechao_lciod"
    assert: {type: contains_any, values: ["running", "stopped"]}
    severity: critical
    requires: [adb_shell_reachable]
    on_fail:
      collectors: [lciod_daemon_logcat, lciod_device_state]

  - id: daemon_service_registered
    description: "[DA-08] service list 含 system.lechao.lciod.IIoService"
    command: "service list | grep system.lechao.lciod.IIoService"
    assert: {type: contains, value: "system.lechao.lciod.IIoService"}
    severity: critical
    requires: [daemon_process_running]
    on_fail:
      collectors: [lciod_daemon_logcat, lciod_device_state]

  - id: daemon_boot_completed_trigger
    description: "[DA-07] Daemon 启动条件 boot_completed=1"
    command: "getprop sys.boot_completed"
    assert: {type: contains, value: "1"}
    severity: critical
    requires: [daemon_process_running]
    on_fail:
      collectors: [lciod_daemon_logcat]

  - id: daemon_hal_lazy_connect
    description: "[DA-05] HAL 延迟连接——daemon 已注册 IIoService 即代表延迟连接成功"
    command: "service list | grep system.lechao.lciod.IIoService | grep -c default"
    assert: {type: regex, pattern: "^[1-9][0-9]*$"}
    severity: critical
    requires: [daemon_service_registered]
    on_fail:
      collectors: [lciod_daemon_logcat, lciod_hal_logcat]

  - id: daemon_field_projection_stats
    description: "[DA-01/DA-09] Daemon 字段投影——经 daemon 路径 stats 可获取（writeBytes 字段直传）"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "write_bytes", op: "ge", value: 0}
    severity: critical
    requires: [daemon_process_running, lciod_device_node_present]
    on_fail:
      collectors: [lciod_daemon_logcat, lciod_fault_verify_json]

  - id: daemon_get_average_rate
    description: "[DA-02] getAverageRate 派生计算——peak_rate >= 0（HAL 内部 peak_rate 字段）"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "peak_rate", op: "ge", value: 0}
    severity: critical
    requires: [daemon_field_projection_stats]
    on_fail:
      collectors: [lciod_daemon_logcat, lciod_fault_verify_json]

  - id: daemon_current_rate_field
    description: "[DA-01] 字段投影——内核 current_rate 字段 >= 0（HAL 完整暴露）"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "current_rate", op: "ge", value: 0}
    severity: warn
    requires: [daemon_field_projection_stats]
    on_fail:
      collectors: [lciod_daemon_logcat, lciod_fault_verify_json]

  - id: daemon_monitor_thread_logcat
    description: "[DA-04] 后台监控线程 10s 周期——logcat 含 lechao_lciod tag 输出"
    command: "logcat -d -s lechao_lciod:V 2>/dev/null | head -5; echo LOG_DONE"
    assert: {type: contains, value: "LOG_DONE"}
    severity: warn
    requires: [daemon_process_running]
    on_fail:
      collectors: [lciod_daemon_logcat]

  - id: daemon_list_device_minors
    description: "[DA-03] listDeviceMinors——设备节点存在即 daemon 可枚举 minor"
    command: "test -c /dev/vendor_lechao_usbd0 && echo MINORS_OK || echo NO_MINOR"
    assert: {type: contains, value: "MINORS_OK"}
    severity: warn
    requires: [daemon_service_registered, lciod_device_node_present]
    on_fail:
      collectors: [lciod_daemon_logcat, lciod_device_state]

  - id: daemon_death_reconnect_resilient
    description: "[DA-06] 死亡重连——kill HAL 后 daemon 仍存活（init 自动重启 HAL）"
    command: "DPID=$(ps -A | grep 'lechao_lciod$' | awk '{print $2}' | head -1); test -n \"$DPID\" && echo DAEMON_ALIVE || echo DAEMON_GONE"
    assert: {type: contains, value: "DAEMON_ALIVE"}
    severity: warn
    requires: [daemon_process_running]
    on_fail:
      collectors: [lciod_daemon_logcat, lciod_hal_logcat]

  - id: daemon_multi_device_iterate
    description: "[DA-03] 多设备遍历——stats get 成功（单设备场景退化验证）"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null | grep -c read_bytes"
    assert: {type: regex, pattern: "^[1-9][0-9]*$"}
    severity: warn
    requires: [daemon_field_projection_stats]
    on_fail:
      collectors: [lciod_daemon_logcat, lciod_device_state]
