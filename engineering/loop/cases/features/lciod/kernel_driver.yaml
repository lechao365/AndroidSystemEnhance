suite: features.lciod.kernel_driver
version: 1
include:
  - features/lciod/common
defaults:
  capture_timeout: 30.0
  recent_limit: 500
cases:
  # ===== KE-21/KE-11 模块加载 / dmesg 日志格式 / 零侵入 =====
  - id: kernel_module_loaded
    description: "[KE-21] lciod_usbd 驱动已加载（dmesg 含 registered device 日志）"
    command: "dmesg | grep 'registered device vendor_lechao_usbd' | head -1"
    assert: {type: contains, value: "vendor_lechao_usbd"}
    severity: critical
    requires: [lciod_device_node_present]
    on_fail:
      collectors: [lciod_kmsg]

  - id: kernel_patch_loaded_log
    description: "[KE-21] dmesg 含 'vendor patch v1.3 loaded' 日志（模块 init 完成）"
    command: "dmesg | grep 'vendor patch v1.3 loaded' | head -1"
    assert: {type: contains, value: "vendor patch v1.3 loaded"}
    severity: critical
    requires: [lciod_device_node_present]
    on_fail:
      collectors: [lciod_kmsg]

  - id: notifier_injection_no_crash
    description: "[KE-11] notifier 零侵入注入——内核无 panic/oops/BUG"
    command: "dmesg | grep -c -E 'usb-storage.*panic|Oops|BUG:|call trace' || echo 0"
    assert: {type: regex, pattern: "^0$|^\\n$"}
    severity: critical
    requires: [kernel_module_loaded]
    on_fail:
      collectors: [lciod_kmsg]

  - id: dmesg_registered_log_format
    description: "[KE-21] registered device 日志格式含 VID:xxxx PID:xxxx"
    command: "dmesg | grep 'registered device vendor_lechao_usbd' | grep -o 'VID:[0-9a-fA-F]\\{4\\} PID:[0-9a-fA-F]\\{4\\}' | head -1"
    assert: {type: regex, pattern: "VID:[0-9a-fA-F]{4} PID:[0-9a-fA-F]{4}"}
    severity: critical
    requires: [kernel_module_loaded]
    on_fail:
      collectors: [lciod_kmsg]

  # ===== KE-01 设备节点权限 / SELinux =====
  - id: device_node_0666
    description: "[KE-01] 设备节点权限 0666（crw-rw-rw-，源码 devnode callback 设置）"
    command: "ls -l /dev/vendor_lechao_usbd0 2>/dev/null | awk '{print $1}'"
    assert: {type: contains, value: "crw-rw-rw-"}
    severity: critical
    requires: [lciod_device_node_present]
    on_fail:
      collectors: [lciod_device_state]

  - id: device_node_selinux_label
    description: "[KE-01] SELinux 标签存在（lechao_lciod_hal_device 或类似）"
    command: "ls -Z /dev/vendor_lechao_usbd0 2>/dev/null | grep -o 'u:object_r:[^:]*:' | head -1 || echo NO_LABEL"
    assert: {type: not_contains, value: "NOLABEL"}
    severity: warn
    requires: [lciod_device_node_present]
    on_fail:
      collectors: [lciod_device_state]

  # ===== KE-03 ioctl 4 命令（通过 fault-verify 间接验证）=====
  - id: ioctl_get_stats_success
    description: "[KE-03] IOC_GET_STATS 成功——stats get 返回合法 JSON 且 read_bytes>=0"
    command: "fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 1 >/dev/null 2>/dev/null; fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "read_bytes", op: "ge", value: 0}
    severity: critical
    requires: [lciod_device_node_present]
    on_fail:
      collectors: [lciod_fault_verify_json, lciod_kmsg]

  - id: ioctl_reset_state_works
    description: "[KE-03] IOC_RESET_STATE 成功——stats reset 退出码 0"
    command: "fault-verify stats reset --device /dev/vendor_lechao_usbd0 >/dev/null 2>/dev/null; echo $?"
    assert: {type: contains, value: "0"}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json, lciod_kmsg]

  - id: ioctl_get_config_success
    description: "[KE-03] IOC_GET_CONFIG 成功——config get 返回 enabled 字段"
    command: "fault-verify config get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "enabled", op: "exists"}
    severity: critical
    requires: [lciod_device_node_present]
    on_fail:
      collectors: [lciod_fault_verify_json, lciod_kmsg]

  - id: ioctl_set_config_works
    description: "[KE-03/KE-05] IOC_SET_CONFIG 成功——set enable=1 后回读 enabled>=1"
    command: "fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 1 >/dev/null 2>/dev/null; fault-verify config get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "enabled", op: "ge", value: 1}
    severity: critical
    requires: [ioctl_get_config_success]
    on_fail:
      collectors: [lciod_fault_verify_json, lciod_kmsg]

  # ===== KE-04 stats 字段全集 =====
  - id: stats_field_read_bytes
    description: "[KE-04] stats 字段 read_bytes 存在"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "read_bytes", op: "exists"}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  - id: stats_field_write_bytes
    description: "[KE-04] stats 字段 write_bytes 存在"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "write_bytes", op: "exists"}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  - id: stats_field_read_cmds
    description: "[KE-04] stats 字段 read_cmds 存在"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "read_cmds", op: "exists"}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  - id: stats_field_write_cmds
    description: "[KE-04] stats 字段 write_cmds 存在"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "write_cmds", op: "exists"}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  - id: stats_field_vid_pid
    description: "[KE-04] stats 字段 vid/pid 存在（设备识别）"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "vid", op: "exists"}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  - id: stats_field_vendor_product
    description: "[KE-04] stats 字段 vendor/product 字符串存在（厂商/产品名）"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "vendor", op: "exists"}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  - id: stats_field_flags
    description: "[KE-04] stats 字段 flags 存在（配置标志位）"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "flags", op: "exists"}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  # ===== KE-15/16 TRANSPORT_START/END：dd 触发 stats 累计 =====
  - id: stats_write_bytes_nonzero
    description: "[KE-15/16] dd 写后 write_bytes 累计 > 0（TRANSPORT 累计）"
    command: "fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 1 >/dev/null 2>/dev/null; fault-verify stats reset --device /dev/vendor_lechao_usbd0 >/dev/null 2>/dev/null; MNT=$(mount | grep -o '/mnt/media_rw/[^ ]*' | head -1); f=$MNT/lciod_ktest.dat; dd if=/dev/zero of=$f bs=1M count=4 2>/dev/null; sleep 1; fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "write_bytes", op: "gt", value: 0}
    severity: critical
    requires: [lciod_device_node_present]
    tags: [needs_usb_rw]
    on_fail:
      collectors: [lciod_fault_verify_json, lciod_kmsg]

  - id: stats_write_cmds_nonzero
    description: "[KE-15/16] dd 写后 write_cmds 累计 > 0"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "write_cmds", op: "gt", value: 0}
    severity: warn
    requires: [stats_write_bytes_nonzero]
    tags: [needs_usb_rw]
    on_fail:
      collectors: [lciod_fault_verify_json]

  - id: stats_read_bytes_nonzero
    description: "[KE-15/16] dd 读后 read_bytes 累计 > 0（读可能被 FS cache 绕过，warn 级）"
    command: "MNT=$(mount | grep -o '/mnt/media_rw/[^ ]*' | head -1); f=$MNT/lciod_ktest.dat; dd if=$f of=/dev/null bs=1M count=4 2>/dev/null; sleep 1; fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "read_bytes", op: "gt", value: 0}
    severity: warn
    requires: [stats_write_bytes_nonzero]
    tags: [needs_usb_rw]
    on_fail:
      collectors: [lciod_fault_verify_json]

  # ===== KE-05 config enabled 运行时开关 =====
  - id: config_disabled_stats_not_update
    description: "[KE-05] enabled=0 时 stats 不更新（set 0 → reset → dd → write_bytes 仍为 0）"
    command: "fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 0 >/dev/null 2>/dev/null; fault-verify stats reset --device /dev/vendor_lechao_usbd0 >/dev/null 2>/dev/null; MNT=$(mount | grep -o '/mnt/media_rw/[^ ]*' | head -1); f=$MNT/lciod_ktest_dis.dat; dd if=/dev/zero of=$f bs=1M count=2 2>/dev/null; sleep 1; fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null; fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 1 >/dev/null 2>/dev/null"
    assert: {type: json_field, path: "write_bytes", op: "eq", value: 0}
    severity: critical
    requires: [ioctl_set_config_works]
    tags: [needs_usb_rw]
    on_fail:
      collectors: [lciod_fault_verify_json]

  # ===== KE-18 异常事件计数器字段存在 =====
  - id: stats_field_error_count
    description: "[KE-18] stats 字段 error_count 存在"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "error_count", op: "ge", value: 0}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  - id: stats_field_stall_count
    description: "[KE-18] stats 字段 stall_count 存在"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "stall_count", op: "ge", value: 0}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  - id: stats_field_corrupt_count
    description: "[KE-18] stats 字段 corrupt_count 存在"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "corrupt_count", op: "ge", value: 0}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  - id: stats_field_timeout_count
    description: "[KE-18] stats 字段 timeout_count 存在"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "timeout_count", op: "ge", value: 0}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  - id: stats_field_reset_count
    description: "[KE-18] stats 字段 reset_count 存在"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "reset_count", op: "ge", value: 0}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  # ===== KE-17 degrade 判定 =====
  - id: degrade_count_field_present
    description: "[KE-17] degrade_count 字段存在且 >= 0"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "degrade_count", op: "ge", value: 0}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  # ===== KE-12/KE-13 PROBE / DISCONNECT 热插拔 =====
  - id: probe_count_field_present
    description: "[KE-12/KE-13] probe_count 字段存在且 >= 1（模块加载时扫描已有设备）"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "probe_count", op: "ge", value: 1}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  - id: disconnect_count_field_present
    description: "[KE-12] disconnect_count 字段存在（DISCONNECT 计数器）"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "disconnect_count", op: "ge", value: 0}
    severity: critical
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  # ===== KE-19 reset 保留策略 =====
  - id: reset_preserves_probe_count
    description: "[KE-19] stats reset 后 probe_count 不变（>= 0，简化验证）"
    command: "fault-verify stats reset --device /dev/vendor_lechao_usbd0 >/dev/null 2>/dev/null; fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "probe_count", op: "ge", value: 0}
    severity: warn
    requires: [ioctl_reset_state_works]
    on_fail:
      collectors: [lciod_fault_verify_json]

  # ===== KE-06 事件类型枚举 / KE-07 环形缓冲区溢出 =====
  - id: event_read_returns_valid_type
    description: "[KE-06] event read 返回的 event_type 合法（none/stall/timeout/corrupt/reset/transport_error 或超时）"
    command: "fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 1 >/dev/null 2>/dev/null; MNT=$(mount | grep -o '/mnt/media_rw/[^ ]*' | head -1); f=$MNT/lciod_evt.dat; dd if=/dev/zero of=$f bs=1M count=1 2>/dev/null; dd if=$f of=/dev/null bs=1M count=1 2>/dev/null; sleep 2; timeout 5 fault-verify event read --device /dev/vendor_lechao_usbd0 --timeout-ms 2000 --json 2>&1 || true"
    assert: {type: contains_any, values: ["\"event_type\"", "\"error\": true", "Event read failed"]}
    severity: warn
    requires: [lciod_device_node_present]
    tags: [needs_usb_rw]
    on_fail:
      collectors: [lciod_fault_verify_json]

  - id: event_drop_count_not_output
    description: "[KE-07] 环形缓冲区溢出计数 event_drop_count 在 fault-verify 未输出（当前实现现状，预期 not_exists）"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null"
    assert: {type: json_field, path: "event_drop_count", op: "not_exists"}
    severity: warn
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  # ===== KE-08/KE-09 阻塞 read / poll 多路复用 =====
  - id: blocking_read_semantics
    description: "[KE-08] 阻塞 read 语义——event read 阻塞/超时行为正常（exit_code 0 或 4 均合法）"
    command: "fault-verify config set --device /dev/vendor_lechao_usbd0 --enable 1 >/dev/null 2>/dev/null; timeout 6 fault-verify event read --device /dev/vendor_lechao_usbd0 --timeout-ms 3000 --json >/dev/null 2>&1; rc=$?; echo exit=$rc"
    assert: {type: regex, pattern: "exit=(0|4|124)"}
    severity: warn
    requires: [lciod_device_node_present]
    on_fail:
      collectors: [lciod_fault_verify_json, lciod_kmsg]

  - id: poll_multiplex_working
    description: "[KE-09] poll 多路复用——event read 内部 poll 不死锁（exit_code 0 正常）"
    command: "MNT=$(mount | grep -o '/mnt/media_rw/[^ ]*' | head -1); f=$MNT/lciod_poll.dat; dd if=/dev/zero of=$f bs=1M count=1 2>/dev/null; dd if=$f of=/dev/null bs=1M count=1 2>/dev/null; sleep 2; timeout 5 fault-verify event read --device /dev/vendor_lechao_usbd0 --timeout-ms 2000 --json >/dev/null 2>&1; echo exit=$?"
    assert: {type: regex, pattern: "exit=(0|4|124)"}
    severity: warn
    requires: [blocking_read_semantics]
    tags: [needs_usb_rw]
    on_fail:
      collectors: [lciod_fault_verify_json]

  # ===== KE-10 kref 引用计数 =====
  - id: kref_lifecycle_no_leak
    description: "[KE-10] kref 无泄漏——多次 open/close 后无残留 fd"
    command: "for i in $(seq 1 10); do fault-verify stats get --device /dev/vendor_lechao_usbd0 --json > /dev/null 2>&1; done; echo FD_CHECK_OK"
    assert: {type: contains, value: "FD_CHECK_OK"}
    severity: warn
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_device_state]

  # ===== KE-20 LcView 9 种打点 =====
  - id: lcview_events_exist
    description: "[KE-20] LcView 9 事件打点——/data/vendor/lechao_lcview/logs/ 含 .jsonl"
    command: "ls /data/vendor/lechao_lcview/logs/*.jsonl 2>/dev/null | head -1 && echo JSONL_EXISTS || echo NO_JSONL"
    assert: {type: contains, value: "JSONL_EXISTS"}
    severity: warn
    requires: [kernel_module_loaded]
    tags: [requires_lcview]
    on_fail:
      collectors: [lciod_kmsg]

  # ===== KE-22 线程安全（间接）=====
  - id: thread_safety_no_deadlock
    description: "[KE-22] 线程安全——并发 stats get（5 次串行）无死锁挂起"
    command: "for i in 1 2 3 4 5; do fault-verify stats get --device /dev/vendor_lechao_usbd0 --json >/dev/null 2>&1 || echo FAIL_$i; done; echo THREAD_OK"
    assert: {type: contains, value: "THREAD_OK"}
    severity: warn
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]

  # ===== KE-02 ABI 版本（间接）=====
  - id: abi_version_indirect
    description: "[KE-02] ABI 版本 v2 间接验证——fault-verify 与驱动 ioctl 兼容（stats get 成功即代表 ABI 一致）"
    command: "fault-verify stats get --device /dev/vendor_lechao_usbd0 --json 2>/dev/null | grep -c read_bytes"
    assert: {type: regex, pattern: "^[1-9][0-9]*$"}
    severity: warn
    requires: [ioctl_get_stats_success]
    on_fail:
      collectors: [lciod_fault_verify_json]
