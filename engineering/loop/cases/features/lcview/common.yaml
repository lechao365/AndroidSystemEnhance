suite: features.lcview.common
version: 1
defaults:
  capture_timeout: 15.0
  recent_limit: 400
final_collectors:
  - lcview_pull_logs
  - lcview_invalid_log
  - lcview_service_state
  - lcview_runtime_context
cases:
  - id: adb_shell_reachable
    description: "[code] adb shell 连通性基线（依赖 network-adbd bootstrap 已通过串口取 IP 并 adb connect）"
    command: "echo lcview_adb_ok"
    assert: {type: contains, value: "lcview_adb_ok"}
    severity: critical

  - id: boot_completed
    description: "[code] 系统启动完成（daemon 依赖 sys.boot_completed=1 启动）"
    command: "getprop sys.boot_completed"
    assert: {type: contains, value: "1"}
    severity: critical
    requires: [adb_shell_reachable]
    on_fail:
      collectors: [lcview_logcat, lcview_kmsg, serial_recent]

  - id: lcview_device_node_present
    description: "[spec LV-KE-01] /dev/vendor_lechao_lcview 字符设备节点存在"
    command: "ls -l /dev/vendor_lechao_lcview 2>/dev/null || echo NO_NODE"
    assert: {type: not_contains, value: "NO_NODE"}
    severity: critical
    requires: [adb_shell_reachable]
    on_fail:
      collectors: [lcview_kmsg, lcview_files, serial_recent]

  - id: lcview_device_node_is_char
    description: "[spec LV-KE-01] 节点为字符设备（权限首字符为 c）"
    command: "ls -l /dev/vendor_lechao_lcview 2>/dev/null | awk '{print $1}'"
    assert: {type: regex, pattern: "^c"}
    severity: critical
    requires: [lcview_device_node_present]
    on_fail:
      collectors: [lcview_files, lcview_kmsg]

  - id: lcview_kernel_module_loaded
    description: "[spec LV-KE-02] 内核模块已加载初始化（sysfs /sys/module/lcview + class 节点存在；不依赖 dmesg 环形缓冲，避免设备长运行后早期 init 日志滚出导致 false positive）"
    command: "test -d /sys/module/lcview && test -d /sys/class/lcview/vendor_lechao_lcview && echo MODULE_OK || echo MODULE_MISSING"
    assert: {type: contains, value: "MODULE_OK"}
    severity: critical
    requires: [adb_shell_reachable]
    on_fail:
      collectors: [lcview_kmsg, serial_recent]

  - id: lcview_hal_service_state
    description: "[code] HAL 服务状态（oneshot，可能 stopped 或 running）[LV-CHAIN-01]"
    command: "getprop init.svc.lechao_lcview_hal"
    assert: {type: regex, pattern: "running|stopped|restarting"}
    severity: critical
    requires: [adb_shell_reachable]
    on_fail:
      collectors: [lcview_logcat, lcview_service_state, serial_recent]

  - id: lcview_daemon_service_state
    description: "[code] daemon 服务状态（oneshot，boot_completed=1 后启动）[LV-CHAIN-01]"
    command: "getprop init.svc.lechao_lcview"
    assert: {type: regex, pattern: "running|stopped|restarting"}
    severity: critical
    requires: [adb_shell_reachable]
    on_fail:
      collectors: [lcview_logcat, lcview_service_state, serial_recent]

  - id: lcview_no_validate_errors
    description: "[code] daemon logcat 无 fault injected 或 validate failed 错误"
    command: "logcat -d -s lechao_lcview:* 2>/dev/null | grep -E 'fault injected|validate failed: bad magic' | wc -l"
    assert: {type: contains, value: "0"}
    severity: critical
    requires: [lcview_daemon_service_state]
    on_fail:
      collectors: [lcview_logcat, lcview_pull_logs]

  - id: lcview_no_readloop_abort
    description: "[code] daemon logcat 无解析循环异常中断日志（read-loop fault N1；主动 restart daemon 使启动日志故障稳定重现，避免 deploy logcat -c 清缓冲导致假 PASS）"
    command: "logcat -c 2>/dev/null; setprop ctl.restart lechao_lcview 2>/dev/null; sleep 5; logcat -d -s lechao_lcview:* 2>/dev/null | grep -c 'parse loop aborted: read-loop fault N1'"
    assert: {type: equals, value: "0"}
    severity: critical
    requires: [lcview_daemon_service_state]
    on_fail:
      collectors: [lcview_logcat, lcview_pull_logs]

  - id: lcview_no_fw_degraded
    description: "[code] daemon logcat 无 filewriter degraded 异常日志（验证 OpencodeAnalyzer LLM 闭环；主动 restart daemon 使启动日志故障稳定重现，避免 deploy logcat -c 清缓冲导致假 PASS）"
    command: "logcat -c 2>/dev/null; setprop ctl.restart lechao_lcview 2>/dev/null; sleep 5; logcat -d -s lechao_lcview:* 2>/dev/null | grep -c 'filewriter degraded'"
    assert: {type: equals, value: "0"}
    severity: critical
    requires: [lcview_daemon_service_state]
    on_fail:
      collectors: [lcview_logcat, lcview_pull_logs]

  - id: lcview_no_config_drift
    description: "[code] daemon logcat 无 unrecoverable config drift 异常（N3 故障注入专属捕获 case，验证三层 analyzer 空产出 → ESCALATE_HUMAN）"
    command: "logcat -d -s lechao_lcview:* 2>/dev/null | grep -c 'unrecoverable config drift'"
    assert: {type: equals, value: "0"}
    severity: critical
    requires: [lcview_daemon_service_state]
    on_fail:
      collectors: [lcview_logcat, lcview_pull_logs]

  - id: lcview_no_n6_fault_prop
    description: "[code] boot 后无 N6 故障属性 lechao.fault.n6（N6 故障注入 init.rc 专属捕获 case，验证 DD_BOOT_REBOOT 链路；属性由 init 在 boot 时设置，持久可检测，不依赖 daemon）"
    command: "getprop lechao.fault.n6"
    assert: {type: equals, value: ""}
    severity: critical
    requires: [adb_shell_reachable]
    on_fail:
      collectors: [lcview_service_state, serial_recent]

  - id: lcview_schema_present
    description: "[code] schema 文件 /vendor/etc/lcview_events.json 存在 [LV-FW-01]"
    command: "test -f /vendor/etc/lcview_events.json && echo present"
    assert: {type: contains, value: "present"}
    severity: critical
    requires: [adb_shell_reachable]
    on_fail:
      collectors: [lcview_files, lcview_logcat, serial_recent]

  - id: lcview_data_dir_ready
    description: "[code] 数据目录 /data/vendor/lechao_lcview/logs 存在（post-fs-data 创建）"
    command: "test -d /data/vendor/lechao_lcview/logs && echo ready"
    assert: {type: contains, value: "ready"}
    severity: critical
    requires: [adb_shell_reachable]
    on_fail:
      collectors: [lcview_files, lcview_service_state, serial_recent]

collectors:
  serial_recent:
    mode: runtime_context
    hints: "adb 运行上下文（endpoint / recent commands / logcat snapshot）"
  lcview_logcat:
    mode: adb_logcat
    buffers: [main, system, crash]
    filters: ["lechao_lcview", "lechao_lcview_hal"]
    failure_code: LCVIEW_PIPELINE_FAIL
    hints: "检查 lcview daemon / hal logcat 中的 connect/open/schema/filewriter 错误"

  lcview_kmsg:
    commands:
      - "dmesg | grep -i lcview"
    failure_code: LCVIEW_PIPELINE_FAIL
    hints: "检查内核侧 lcview / lciod 相关日志"

  lcview_service_state:
    commands:
      - "getprop init.svc.lechao_lcview"
      - "getprop init.svc.lechao_lcview_hal"
      - "ps -A | grep -E 'lechao_lcview|lcview'"
    failure_code: LCVIEW_PREREQ_FAIL
    hints: "检查 daemon / hal 服务状态与进程存在性"

  lcview_files:
    commands:
      - "ls -l /vendor/etc/lcview_events.json"
      - "ls -l /data/vendor/lechao_lcview"
      - "ls -lt /data/vendor/lechao_lcview/logs"
      - "ls -l /dev/vendor_lechao_lcview"
      - "ls -Z /dev/vendor_lechao_lcview"
    failure_code: LCVIEW_PREREQ_FAIL
    hints: "检查 schema / data dir / logs 目录 / 设备节点状态"

  lcview_pull_logs:
    mode: adb_pull
    remote_paths:
      - "/data/vendor/lechao_lcview/logs"
    required: true
    failure_code: LCVIEW_EVIDENCE_FAIL
    hints: "拉取 jsonl 目录，验证结构化日志是否回收到 host"

  lcview_invalid_log:
    mode: adb_pull
    remote_paths:
      - "/data/vendor/lechao_lcview/invalid_records.log"
    required: false
    failure_code: LCVIEW_EVIDENCE_FAIL
    hints: "采集 invalid_records.log，辅助判断 schema / decode 问题"

  lcview_runtime_context:
    mode: runtime_context
    required: true
    failure_code: ADB_EXEC_FAIL
    hints: "记录 adb endpoint / recent commands / reconnect / logcat snapshot"
