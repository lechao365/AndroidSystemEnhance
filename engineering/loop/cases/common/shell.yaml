# 公共 shell 可达性用例 + 公共诊断 collector 库。
# 被其他 suite include 复用：
#   include:
#     - common/shell
# 即可获得 shell_reachable 用例与 boot_log / init_log / crash_dump / kmsg 四个诊断 collector。
# FQN：common.shell.shell_reachable / common.shell.boot_log / ...
suite: common.shell
version: 1

cases:
  - id: shell_reachable
    # 空 command 表示仅探测 prompt：不发任何命令，依赖 transport 实现的
    # prompt_visible 断言（host 等待 prompt 出现即判定设备串口可达）。
    description: "shell prompt 可见，设备串口可达（空 command = 仅探测 prompt）"
    command: ""
    assert:
      type: prompt_visible
    severity: critical
    tags: [shell, reachable]
    on_fail:
      collectors: [serial_recent]

# 公共诊断 collector 库：所有 include common.shell 的 suite 自动获得。
# 业务 suite 失败时按短名引用即可，loader 解析为 common.shell.<name>。
collectors:
  serial_recent:
    commands: []
    mode: serial_context
    hints: "关注 reboot marker、zygote 重启前后串口片段"
  boot_log:
    commands:
      - "dmesg"
    hints: "关注 boot 时序 / init 阶段卡点 / kernel 错误"
  init_log:
    commands:
      - "getprop init.svc.*"
      - "logcat -b system -d"
    hints: "关注 service 重启频率 / 退出信号 / last_reason"
  crash_dump:
    commands:
      - "logcat -b crash -d"
      - "ls -la /data/tombstones/"
    hints: "关注 abort message / signal / fault addr / backtrace"
  kmsg:
    commands:
      - "cat /proc/last_kmsg 2>/dev/null || dmesg | head -200"
    hints: "上一次启动的内核日志（诊断 reboot 原因关键，last_kmsg 优先，回退 dmesg）"
