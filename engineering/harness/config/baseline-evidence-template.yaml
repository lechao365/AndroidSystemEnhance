# Baseline 证据模板
# 本模板定义 patch 资产晋升为 promoted baseline 时必须落盘的最小证据集。
# 状态登记见 baseline-status.yaml，状态语义见 ../README.md#控制总纲（状态模型与证据要求）
#
# 晋升规则:
#   1. candidate baseline → promoted baseline 需全部字段填齐且非空
#   2. archive 阶段仅需 baseline_id / source_branch / source_commit / sync_manifest
#   3. candidate baseline 阶段需在 archive 基础上补齐 build_result / package_result
#   4. 任一字段缺失 → 状态不可前进，禁止作为 revert 真相源

# 模板（复制填写）:
# baseline_id: BL-YYYYMMDD-NN       # 基线唯一标识（与 baseline-status.yaml 主键一致）
# source_branch:                     # 同步时 workspace 的分支（如 rpi5-dev）
# source_commit:                     # 同步时 workspace 的 commit
# sync_manifest:                     # sync 产出的 manifest 路径
# build_result:                      # 增量编译结果 PASS / 附日志路径
# package_result:                    # 打包镜像结果 PASS / 附产物路径
# board_verify:                      # 刷机上板功能验证结果 PASS / 附验证摘要
# approved_by:                       # 批准人
# approved_at:                       # 批准完成时间戳（如 2026-06-20T12:34:56+08:00）
