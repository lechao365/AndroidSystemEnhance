# ============================================================================
# paths.conf — harness 路径配置（单一事实源）
# 相对路径基于项目根解析；KERNEL_WS/AOSP_WS 支持环境变量覆盖（${VAR:-} 语法）
# ============================================================================

PATCHS_DIR="code/rpi5"
KERNEL_WS="${KERNEL_WS:-/home/lechao/workspace/rpi5-kernel-build/common}"
AOSP_WS="${AOSP_WS:-/home/lechao/workspace/aosp}"
# 设备身份期望序列号（ws_adb_connect 设备身份校验）：设置时连上即核对
# ro.serialno，不符即拒（防连错设备/误连旧机）。可经同名环境变量覆盖。
LC_VERIFY_EXPECT_SERIAL="${LC_VERIFY_EXPECT_SERIAL:-29fa4e96efa65bc1}"
# 注：跨设备角色（emit/apply）为设备级属性，不入本共享配置——经环境变量
# HARNESS_ROLE 声明（缺省 apply，安全缺省），由 harness/lib/role_guard.py 读取。
