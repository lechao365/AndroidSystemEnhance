# 最小 CI：只跑 harness 自检（pytest 全量 + 引用完整性 + 配置治理 + 命令/skill 契约）。
# 硬约束（批次 ca64a314af81 方向 4/5）：
#   - GitHub 托管 Linux runner；禁止 apply 机（或任何开发机）注册为 self-hosted runner
#   - 最小权限（contents: read）；不使用任何 secrets
#   - action 按 commit SHA 固定（不用浮动 tag），升级须显式换 SHA 并评审
#   - 自检走无打点指针降级路径：CDP_PROJECT_ROOT 指向 runner 临时目录，
#     cdp_timing mark 无打点指针时 warn 返非零、selfcheck 捕获后不阻断（既有降级行为），
#     打点/收据落点均在临时目录，不污染检出树
name: selfcheck

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    # 无打点指针降级（方向 5）：log/打点/收据落点全指 runner 临时目录，不污染检出树；
    # cdp_timing mark 无指针时 warn 返非零，selfcheck 捕获后不阻断
    # 注（2026-09-11）：CDP_PROJECT_ROOT 原在 job 级 env 用 ${{ runner.temp }}
    # ——runner 上下文仅 step 级可用，job 级 env 求值失败致工作流启动失败
    # （89 次 run 全 failure 且零 job 起来）。改 step 级 env 用 $RUNNER_TEMP。
    steps:
      # actions/checkout v4.2.2（SHA 固定；禁浮动 tag）
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 安装测试依赖（无 secrets；runner 自带 Python）
        run: python3 -m pip install --quiet pyyaml pytest pytest-xdist ruff

      - name: 自检
        env:
          # step 级 env 用 ${{ runner.temp }} 表达式（step 内 runner 上下文
          # 可用）：Actions env 不做 shell 展开，$RUNNER_TEMP 是字面量会在
          # 检出树建同名目录污染检出树（2026-09-11 修正）
          CDP_PROJECT_ROOT: ${{ runner.temp }}/cdp-root
        run: |
          mkdir -p "$CDP_PROJECT_ROOT"
          out="$(python3 harness/lib/selfcheck.py)"
          echo "$out"
          # 方向 1 + 方向 3：selfcheck main 恒返 0（只采集不判定），必须解析
          # 输出中全部 *_rc（含 pyenv_rc/ioctl_rc）任一非零即失败——否则测试
          # 失败也绿（CI 只跑不判）；键集合与 ws_report 必查键同源
          for rc_name in pytest_rc refs_rc config_rc contract_rc pyenv_rc ioctl_rc manifest_rc discipline_rc scan_rc ruff_rc host_rc metrics_rc opencode_rc; do
            echo "$out" | grep -Eq "${rc_name}=0" \
              || { echo "error: ${rc_name} 非零，自检失败"; exit 1; }
          done

  # P0-A 业务快检作业：内核 host 单测 + diff 驱动 C/C++ 静态检查（P0-B）。
  # 约束同上（GitHub 托管、最小权限、无 secrets、action SHA 固定）。
  # diff 驱动：仅相对 origin/main 改动的 C/H 文件做 clang-format 校验与
  # host 单测纯逻辑文件的 clang-tidy 分析——存量 code/ 文件不强制归一
  # （git-works-push 收据门禁约束），本批无 C 改动则跳过通过。
  host-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: 安装 clang 静态检查工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format clang-tidy

      - name: 内核 host 单测（LcView / LcIod）
        run: |
          make -C code/rpi5/kernel/new/vendor/lechao/LcView/tests test
          make -C code/rpi5/kernel/new/vendor/lechao/LcIod/tests test

      - name: C/C++ 静态检查（diff 驱动，无 C 改动跳过）
        run: |
          set -euo pipefail
          git fetch --quiet origin main || true
          CHANGED=$(git diff --name-only --diff-filter=ACM origin/main...HEAD -- '*.c' '*.h' || true)
          if [ -z "$CHANGED" ]; then
            echo "本批无 C/C++ 改动，静态检查跳过"
            exit 0
          fi
          echo "检查文件: $CHANGED"
          for f in $CHANGED; do
            clang-format --dry-run --Werror "$f"
          done
          # clang-tidy 仅对 host 单测纯逻辑文件（独立可编译，带 -I 旗标）
          for f in $CHANGED; do
            case "$f" in
              code/rpi5/kernel/new/vendor/lechao/LcView/lcview_ring_logic.c)
                clang-tidy -p . "$f" -- -Icode/rpi5/kernel/new/vendor/lechao/LcView ;;
              code/rpi5/kernel/new/vendor/lechao/LcIod/lciod_read_logic.c)
                clang-tidy -p . "$f" -- -Icode/rpi5/kernel/new/vendor/lechao/LcIod ;;
            esac
          done
