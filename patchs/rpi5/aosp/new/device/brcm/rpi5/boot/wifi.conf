# WiFi 自动连接配置（修改后重启生效）
# ssid: WiFi 名称
# psk:  WiFi 密码
# key_mgmt: 可选，默认 WPA2-PSK；开放网络设 NONE，WPA3 设 SAE
#
# 静态 IP 配置（可选，留空则用 DHCP）
# 填写后由脚本用 ip 命令强制设置（Android 15 cmd wifi 不支持静态 IP）

ssid = HUAWEI-BE7P
psk = default

static_ip = 192.168.1.55
gateway   = 192.168.1.1
netmask   = 255.255.255.0
dns       = 192.168.1.1
